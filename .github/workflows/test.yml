name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on every shell script
        run: |
          set -e
          fail=0
          for f in bin/nav hooks/*.sh lib/*.sh setup.sh; do
            [ -f "$f" ] || continue
            echo "Checking $f"
            bash -n "$f" || fail=1
          done
          exit $fail

      - name: Validate plugin JSON files
        run: |
          set -e
          fail=0
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            [ -f "$f" ] || continue
            echo "Validating $f"
            jq . "$f" > /dev/null || fail=1
          done
          exit $fail

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          fail=0
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            echo "Checking $f"
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::missing frontmatter opening ---"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::missing 'name:' field"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::missing 'description:' field"; fail=1; }
          done
          exit $fail
